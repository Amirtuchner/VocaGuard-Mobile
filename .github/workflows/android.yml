name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]           # Also run on version tags (e.g. v1.2) for Play Store publish
  pull_request:
    branches: [ main, master ]

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Unit tests + lint  (runs on every push and PR)
  # -----------------------------------------------------------------------
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | base64 --decode > app/google-services.json

      - name: Run unit tests
        run: ./gradlew clean test --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Upload lint results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html

  # -----------------------------------------------------------------------
  # Job 2: Debug APK  (installable artifact for PR testing)
  # -----------------------------------------------------------------------
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | base64 --decode > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # -----------------------------------------------------------------------
  # Job 3: Signed release APK  (only on pushes to main/master, not PRs)
  #
  # Required GitHub Secrets:
  #   KEYSTORE_BASE64   – base64-encoded .jks keystore file
  #                       (openssl base64 -in release.jks | tr -d '\n')
  #   KEY_ALIAS         – alias of the signing key inside the keystore
  #   KEY_PASSWORD      – password for the signing key
  #   STORE_PASSWORD    – password for the keystore file
  # -----------------------------------------------------------------------
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push'

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | base64 --decode > app/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build signed release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload ProGuard mapping
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: proguard-mapping
          path: app/build/outputs/mapping/release/mapping.txt

  # -----------------------------------------------------------------------
  # Job 4: Publish to Google Play  (only on version tags, e.g. v1.2)
  #
  # Required GitHub Secrets:
  #   KEYSTORE_BASE64          – same keystore used by build-release
  #   KEY_ALIAS                – same as build-release
  #   KEY_PASSWORD             – same as build-release
  #   STORE_PASSWORD           – same as build-release
  #   PLAY_SERVICE_ACCOUNT_JSON – Google Play service account JSON key
  #                              (created in Google Play Console →
  #                               Setup → API access → Service accounts)
  #
  # Setup steps:
  #   1. In Google Play Console, grant the service account "Release manager" role.
  #   2. Base64-encode the JSON key and store as PLAY_SERVICE_ACCOUNT_JSON secret.
  #   3. The first release must be uploaded manually; subsequent ones use this job.
  # -----------------------------------------------------------------------
  publish-play-store:
    name: Publish to Google Play
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | base64 --decode > app/google-services.json

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build signed release bundle (AAB)
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Decode Play service account JSON
        run: |
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" | base64 --decode > play-service-account.json

      - name: Publish AAB to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-service-account.json
          packageName: io.vocaguard
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal        # Change to 'production' when ready for full rollout
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          status: completed
