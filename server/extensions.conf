[vocaguard-incoming]
; Handles calls forwarded from user's real phone via DIDWW.
; Sends FCM alert immediately (with channel name), then waits up to 60s for
; user to tap Accept in the VocaGuard app (which triggers AMI Originate to
; Linphone via the vocaguard-user context below).
; If no bridge occurs within 60s, falls through to server-side EAGI scam analysis.
exten => _X.,1,NoOp(VocaGuard incoming: ${CALLERID(num)})
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,AGI(/opt/vocaguard/notify_incoming.py)
 same => n,Ringing()
 same => n,WaitForBridge(60)
 same => n,GotoIf($["${WAITFORBRIDGE_REASON}" != "timeout"]?done)
 same => n,Answer()
 same => n,EAGI(/opt/vocaguard/scam_detector.py)
 same => n(done),Hangup()

exten => _[0-9a-zA-Z].,1,NoOp(VocaGuard incoming: ${CALLERID(num)})
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,AGI(/opt/vocaguard/notify_incoming.py)
 same => n,Ringing()
 same => n,WaitForBridge(60)
 same => n,GotoIf($["${WAITFORBRIDGE_REASON}" != "timeout"]?done)
 same => n,Answer()
 same => n,EAGI(/opt/vocaguard/scam_detector.py)
 same => n(done),Hangup()

[vocaguard-user]
; Executed on the Linphone (PJSIP/vocaguard) channel after user taps Accept.
; ORIG_CHANNEL: Asterisk channel name of the waiting incoming call (scammer).
; ORIG_CALLER:  Scammer's phone number (for scam alert FCM payload).
; Starts background Vosk/Whisper analysis via MixMonitor -> FIFO, then bridges.
exten => s,1,NoOp(Bridge user to ${ORIG_CHANNEL})
 same => n,Set(FIFO=/tmp/vg_${UNIQUEID}.slin)
 same => n,System(mkfifo ${FIFO} 2>/dev/null; /opt/vocaguard-venv/bin/python3 /opt/vocaguard/scam_detector_bg.py "${FIFO}" "${ORIG_CALLER}" &)
 same => n,Wait(1)
 same => n,MixMonitor(${FIFO},r,)
 same => n,Bridge(${ORIG_CHANNEL})
 same => n,Hangup()
