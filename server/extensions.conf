[vocaguard-incoming]
; Handles calls forwarded from user's real phone via DIDWW.
; Sends FCM alert immediately (with channel name), then waits up to 60s for
; user to tap Accept in the VocaGuard app (which triggers AMI Originate to
; the user's Linphone extension via the vocaguard-user context below).
; If no bridge occurs within 60s, falls through to server-side EAGI scam analysis.
;
; ORIGINAL_CALLED: the user's real number before *21* forwarding, extracted
;   from the SIP Diversion header by Asterisk's REDIRECTING(from-num).
;   DIDWW sends e.g. 528233354 (digits only, no +972 prefix).
;   Used by notify_incoming.py and scam_detector.py for multi-tenant FCM routing.
exten => _X.,1,NoOp(VocaGuard incoming: ${CALLERID(num)})
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(ORIGINAL_CALLED=${REDIRECTING(from-num)})
 same => n,NoOp(Original called: ${ORIGINAL_CALLED})
 same => n,AGI(/opt/vocaguard/notify_incoming.py)
 same => n,Answer()
 same => n,PlayTones(ring)
 same => n,Wait(60)
 same => n,StopPlayTones()
 same => n,GotoIf($["${VG_ACCEPTED}" = "1"]?done)
 same => n,EAGI(/opt/vocaguard/scam_detector.py)
 same => n(done),Hangup()

exten => _[0-9a-zA-Z].,1,NoOp(VocaGuard incoming: ${CALLERID(num)})
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(ORIGINAL_CALLED=${REDIRECTING(from-num)})
 same => n,NoOp(Original called: ${ORIGINAL_CALLED})
 same => n,AGI(/opt/vocaguard/notify_incoming.py)
 same => n,Answer()
 same => n,PlayTones(ring)
 same => n,Wait(60)
 same => n,StopPlayTones()
 same => n,GotoIf($["${VG_ACCEPTED}" = "1"]?done)
 same => n,EAGI(/opt/vocaguard/scam_detector.py)
 same => n(done),Hangup()

[vocaguard-user]
; Executed on the user's SIP extension channel after they tap Accept.
; ORIG_CHANNEL: Asterisk channel of the waiting incoming call (scammer).
; ORIG_CALLER:  Scammer's phone number.
; USER_PHONE:   User's original number (from Diversion) — passed by AMI Originate
;               so scam_detector_bg.py can look up the correct FCM token.
exten => s,1,NoOp(Bridge user to ${ORIG_CHANNEL} user=${USER_PHONE})
 same => n,Set(FIFO=/tmp/vg_${UNIQUEID}.slin)
 same => n,System(mkfifo ${FIFO} 2>/dev/null)
 same => n,System(nohup /opt/vocaguard-venv/bin/python3 /opt/vocaguard/scam_detector_bg.py ${FIFO} ${ORIG_CALLER} ${USER_PHONE} >> /var/log/vocaguard_bg.log 2>&1 &)
 same => n,Wait(1)
 same => n,MixMonitor(${FIFO},r,)
 same => n,Bridge(${ORIG_CHANNEL})
 same => n,Hangup()
