[global]
type=global
default_realm=asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=178.105.164.91
external_signaling_address=178.105.164.91

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; SIP over TLS (2026-11-24) for the DIDWW trunk and new app builds; audio is
; then SRTP-SDES (keys travel inside this encrypted signalling). UDP/TCP above
; stay for older app builds. Cert = Let's Encrypt api.vocaguard.com, copied to
; /etc/asterisk/keys by /etc/letsencrypt/renewal-hooks/deploy/asterisk-tls.sh.
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/api.vocaguard.com.crt
priv_key_file=/etc/asterisk/keys/api.vocaguard.com.key
method=tlsv1_2
external_media_address=178.105.164.91
external_signaling_address=178.105.164.91
; NO allow_reload: reloading a TLS transport under live connections crashed
; Asterisk (SEGV in pjsip_tpmgr_find_local_addr2, 2026-11-24), and token_server.py
; reloads PJSIP on every new registration. Transport changes need a restart.

; -----------------------------------------------------------------------
; DIDWW outbound registration — Asterisk registers to DIDWW so they know
; where to send inbound calls
; -----------------------------------------------------------------------
[didww-reg]
type=registration
transport=transport-udp
outbound_auth=didww-outbound-auth
server_uri=sip:sip.didww.com
client_uri=sip:d60n8HovalTll3mH@sip.didww.com
contact_user=d60n8HovalTll3mH
retry_interval=60
max_retries=10
expiration=3600

[didww-outbound-auth]
type=auth
auth_type=userpass
username=d60n8HovalTll3mH
password=7g6ZXy5aNGbHcEHY

[didww-trunk]
type=endpoint
transport=transport-udp
context=vocaguard-incoming
disallow=all
allow=ulaw
allow=alaw
allow=opus
direct_media=no
; Accept SRTP-SDES audio when DIDWW sends calls over TLS (2026-11-24);
; optimistic = plain RTP offers are still accepted, so UDP/TCP calls keep working.
media_encryption=sdes
media_encryption_optimistic=yes
aors=didww-trunk

[didww-trunk]
type=aor
max_contacts=3
remove_existing=yes

[didww-identify]
type=identify
endpoint=didww-trunk
match=185.238.173.49
match=46.19.209.49
; DIDWW SIP-over-TLS calls arrive from other hosts (first seen 46.19.210.14,
; 2026-11-24). Trust DIDWW's whole /24s (whois: DIDWW-NET-HOSTING-AMS/-FRA).
match=185.238.173.0/24
match=46.19.209.0/24
match=46.19.210.0/24
; A hostname match here is dangerous: if DNS resolution fails while Asterisk
; loads (e.g. resolver restarting during unattended-upgrades), the ENTIRE
; identify object is discarded — including the IP matches above — and every
; inbound DIDWW call is rejected with "No matching endpoint found".
; This took the trunk down on 2026-07-29. Use static IPs only.
;match=sip.didww.com

; -----------------------------------------------------------------------
; Legacy single-user endpoint (kept as fallback).
; Multi-tenant per-user endpoints are in pjsip_users.conf (auto-generated).
; -----------------------------------------------------------------------
[vocaguard]
type=endpoint
; SRTP-SDES offered to app builds on TLS; optimistic keeps older builds working.
media_encryption=sdes
media_encryption_optimistic=yes
context=vocaguard-user
disallow=all
allow=opus
allow=ulaw
allow=alaw
direct_media=no
; NAT hardening for mobile/CGNAT (mirror of the per-user blocks token_server.py
; generates). force_rport + rewrite_contact fix SIP signalling behind NAT;
; rtp_symmetric sends audio back to the port the phone's RTP really comes from,
; which stops mid-call audio from dropping when the carrier rebinds the RTP port.
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
; rtp_keepalive: send keepalive RTP during silence so the media pinhole never
; closes mid-call (prevents audio dropping out after a quiet moment).
rtp_keepalive=5
auth=vocaguard-auth
aors=vocaguard

[vocaguard-auth]
type=auth
auth_type=userpass
username=vocaguard
password=vocaguard123
realm=asterisk

[vocaguard]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60
; 10s (was 3): tolerate mobile radio latency so a dozing phone isn't wrongly
; marked Unreachable and dropped mid-call.
qualify_timeout=10

; -----------------------------------------------------------------------
; Per-user SIP endpoints — auto-generated by token_server.py on /register.
; Each registered user gets a vocaguard_NNNN endpoint, auth, and aor.
; -----------------------------------------------------------------------
#include pjsip_users.conf
