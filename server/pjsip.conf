[global]
type=global
default_realm=asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=178.105.164.91
external_signaling_address=178.105.164.91

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; -----------------------------------------------------------------------
; DIDWW outbound registration — Asterisk registers to DIDWW so they know
; where to send inbound calls
; -----------------------------------------------------------------------
[didww-reg]
type=registration
transport=transport-udp
outbound_auth=didww-outbound-auth
server_uri=sip:sip.didww.com
client_uri=sip:d60n8HovalTll3mH@sip.didww.com
contact_user=d60n8HovalTll3mH
retry_interval=60
max_retries=10
expiration=3600

[didww-outbound-auth]
type=auth
auth_type=userpass
username=d60n8HovalTll3mH
password=7g6ZXy5aNGbHcEHY

[didww-trunk]
type=endpoint
transport=transport-udp
context=vocaguard-incoming
disallow=all
allow=ulaw
allow=alaw
allow=opus
direct_media=no
aors=didww-trunk

[didww-trunk]
type=aor
max_contacts=3
remove_existing=yes

[didww-identify]
type=identify
endpoint=didww-trunk
match=185.238.173.49
match=46.19.209.49
match=sip.didww.com

; -----------------------------------------------------------------------
; Legacy single-user endpoint (kept as fallback).
; Multi-tenant per-user endpoints are in pjsip_users.conf (auto-generated).
; -----------------------------------------------------------------------
[vocaguard]
type=endpoint
transport=transport-udp
context=vocaguard-user
disallow=all
allow=opus
allow=ulaw
allow=alaw
direct_media=no
auth=vocaguard-auth
aors=vocaguard

[vocaguard-auth]
type=auth
auth_type=userpass
username=vocaguard
password=vocaguard123
realm=asterisk

[vocaguard]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60
qualify_timeout=3

; -----------------------------------------------------------------------
; Per-user SIP endpoints — auto-generated by token_server.py on /register.
; Each registered user gets a vocaguard_NNNN endpoint, auth, and aor.
; -----------------------------------------------------------------------
#include pjsip_users.conf
